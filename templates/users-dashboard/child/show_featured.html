{% extends 'users-dashboard/dist/index.html' %}
{% block head %}
    <title xmlns="http://www.w3.org/2000/svg">head</title>
    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            color: #99a0b0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #f5f5fa;
            font-size: 16px;
            line-height: 120%;
            font-family: Open Sans, Helvetica, sans-serif;
        }

        .dashboard {
            display: grid;
            width: 100%;
            height: 100%;
            grid-gap: 0;
            grid-template-columns: 300px auto;
            grid-template-rows: 80px auto;
            grid-template-areas: 'menu search' 'menu content';
        }

        .search-wrap {
            grid-area: search;
            background: #fff;
            border-bottom: 1px solid #ede8f0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 3em;
        }

        .search-wrap .search {
            height: 40px;
        }

        .search-wrap .search label {
            display: flex;
            align-items: center;
            height: 100%;
        }

        .search-wrap .search label svg {
            display: block;
        }

        .search-wrap .search label svg path,
        .search-wrap .search label svg circle {
            fill: #b6bbc6;
            transition: fill 0.15s ease;
        }

        .search-wrap .search label input {
            display: block;
            padding-left: 1em;
            height: 100%;
            margin: 0;
            border: 0;
        }

        .search-wrap .search label input:focus {
            background: #f5f5fa;
        }

        .search-wrap .search label:hover svg path,
        .search-wrap .search label:hover svg circle {
            fill: #2b3a60;
        }

        .search-wrap .user-actions button {
            border: 0;
            background: none;
            width: 32px;
            height: 32px;
            margin: 0;
            padding: 0;
            margin-left: 0.5em;
        }

        .search-wrap .user-actions button svg {
            position: relative;
            top: 2px;
        }

        .search-wrap .user-actions button svg path,
        .search-wrap .user-actions button svg circle {
            fill: #b6bbc6;
            transition: fill 0.15s ease;
        }

        .search-wrap .user-actions button:hover svg path,
        .search-wrap .user-actions button:hover svg circle {
            fill: #2b3a60;
        }

        .menu-wrap {
            grid-area: menu;
            padding-bottom: 3em;
            overflow: auto;
            background: #fff;
            border-right: 1px solid #ede8f0;
        }

        .menu-wrap .user {
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            margin: 0;
            padding: 0 3em;
        }

        .menu-wrap .user .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            overflow: hidden;
        }

        .menu-wrap .user .user-avatar img {
            display: block;
            width: 100%;
            height: 100%;
            -o-object-fit: cover;
            object-fit: cover;
        }

        .menu-wrap .user figcaption {
            margin: 0;
            padding: 0 0 0 1em;
            color: #1b253d;
            font-weight: 700;
            font-size: 0.875em;
            line-height: 100%;
        }

        .menu-wrap nav {
            display: block;
            padding: 0 3em;
        }

        .menu-wrap nav section {
            display: block;
            padding: 3em 0 0;
        }

        .menu-wrap nav h3 {
            margin: 0;
            font-size: 0.875em;
            text-transform: uppercase;
            color: #4b84fe;
            font-weight: 600;
        }

        .menu-wrap nav ul {
            display: block;
            padding: 0;
            margin: 0;
        }

        .menu-wrap nav li {
            display: block;
            padding: 0;
            margin: 1em 0 0;
        }

        .menu-wrap nav li a {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            color: #99a0b0;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.875em;
            transition: color 0.15s ease;
        }

        .menu-wrap nav li a svg {
            display: block;
            margin-right: 1em;
        }

        .menu-wrap nav li a svg path,
        .menu-wrap nav li a svg circle {
            fill: #b6bbc6;
            transition: fill 0.15s ease;
        }

        .menu-wrap nav li a:hover {
            color: #1b253d;
        }

        .menu-wrap nav li a:hover svg path,
        .menu-wrap nav li a:hover svg circle {
            fill: #2b3a60;
        }

        .menu-wrap nav li a.active {
            color: #4b84fe;
        }

        .menu-wrap nav li a.active svg path,
        .menu-wrap nav li a.active svg circle {
            fill: #4b84fe;
        }

        .content-wrap {
            grid-area: content;
            padding: 3em;
            overflow: auto;
        }

        .content-wrap .content-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .content-wrap .content-head h1 {
            font-size: 1.375em;
            line-height: 100%;
            color: #1b253d;
            font-weight: 500;
            margin: 0;
            padding: 0;
        }

        .content-wrap .content-head .action button {
            border: 0;
            background: #4b84fe;
            color: #fff;
            width: auto;
            height: 3.5em;
            padding: 0 2.25em;
            border-radius: 3.5em;
            font-size: 1em;
            text-transform: uppercase;
            font-weight: 600;
            transition: background-color 0.15s ease;
        }

        .content-wrap .content-head .action button:hover {
            background-color: #1861fe;
        }

        .content-wrap .content-head .action button:hover:active {
            background-color: #0149e2;
            transition: none;
        }

        .content-wrap .info-boxes {
            padding: 3em 0 2em;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            grid-gap: 2em;
        }

        .content-wrap .info-boxes .info-box {
            background: #fff;
            height: 160px;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            padding: 0 3em;
            border: 1px solid #ede8f0;
            border-radius: 5px;
        }

        .content-wrap .info-boxes .info-box .box-icon svg {
            display: block;
            width: 48px;
            height: 48px;
        }

        .content-wrap .info-boxes .info-box .box-icon svg path,
        .content-wrap .info-boxes .info-box .box-icon svg circle {
            fill: #99a0b0;
        }

        .content-wrap .info-boxes .info-box .box-content {
            padding-left: 1.25em;
            white-space: nowrap;
        }

        .content-wrap .info-boxes .info-box .box-content .big {
            display: block;
            font-size: 2em;
            line-height: 150%;
            color: #1b253d;
        }

        .content-wrap .info-boxes .info-box.active svg circle,
        .content-wrap .info-boxes .info-box.active svg path {
            fill: #4b84fe;
        }

        .content-wrap .person-boxes {
            padding: 0;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            grid-gap: 2em;
        }

        .content-wrap .person-boxes .person-box {
            background: #fff;
            height: 320px;
            text-align: center;
            padding: 3em;
            border: 1px solid #ede8f0;
            border-radius: 5px;
        }

        .content-wrap .person-boxes .person-box:nth-child(2n) .box-avatar .no-name {
            background: #4b84fe;
        }

        .content-wrap .person-boxes .person-box:nth-child(5n) .box-avatar .no-name {
            background: #ffbb09;
        }

        .content-wrap .person-boxes .person-box .box-avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            margin: 0px auto;
            overflow: hidden;
        }

        .content-wrap .person-boxes .person-box .box-avatar img {
            display: block;
            width: 100%;
            height: 100%;
            -o-object-fit: cover;
            object-fit: cover;
        }

        .content-wrap .person-boxes .person-box .box-avatar .no-name {
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: #fff;
            font-size: 1.5em;
            font-weight: 600;
            text-transform: uppercase;
            width: 100%;
            height: 100%;
            background: #fa5b67;
        }

        .content-wrap .person-boxes .person-box .box-bio {
        {#white-space: no-wrap;#}
        }

        .content-wrap .person-boxes .person-box .box-bio .bio-name {
            margin: 2em 0 0.75em;
            color: #1b253d;
            font-size: 1em;
            font-weight: 700;
            line-height: 100%;
        }

        .content-wrap .person-boxes .person-box .box-bio .bio-position {
            margin: 0;
            font-size: 0.875em;
            line-height: 100%;
        }

        .content-wrap .person-boxes .person-box .box-actions {
            margin-top: 1.25em;
            padding-top: 1.25em;
            width: 100%;
            border-top: 1px solid #ede8f0;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .content-wrap .person-boxes .person-box .box-actions button {
            border: 0;
            background: none;
            width: 32px;
            height: 32px;
            margin: 0;
            padding: 0;
        }

        .content-wrap .person-boxes .person-box .box-actions button svg {
            position: relative;
            top: 2px;
        }

        .content-wrap .person-boxes .person-box a {
            text-decoration: none;
            color: #99a0b0;

        }

        .content-wrap .person-boxes .person-box a:active {

            color: #99a0b0;

        }

        .content-wrap .person-boxes .person-box .box-actions button svg path,
        .content-wrap .person-boxes .person-box .box-actions button svg circle {
            fill: #b6bbc6;
            transition: fill 0.15s ease;
        }

        .content-wrap .person-boxes .person-box .box-actions button:hover svg path,
        .content-wrap .person-boxes .person-box .box-actions button:hover svg circle {
            fill: #2b3a60;
        }

        .add-button {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background-color: #4CAF50;
            color: white;
            font-size: 30px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s;
            margin-left: 850px;
            margin-top: 80px;
        }

        .add-button:hover {
            background-color: #45a049;
        }

        .add-button:active {
            background-color: #388e3c;
        }

        .add-button:hover {
            background-color: #45a049;
        }

        .add-button:active {
            background-color: #388e3c;
            text-align: right;
        }


    </style>
{% endblock %}
{% block contex %}
    <div class="content">
        <section CLASS="person-boxes">
            {% for inc in income %}
                <div class="person-box">
                    <a href="{% url 'web:income_post' pk=inc.id %}">

                            <span class="no-name">
                                income
                            </span>

            {% for ou in out %}

                            <span class="no-name">
                                OUT
                            </span>
                        </div>

                        <div class="box-bio">
                            <h2 class="bio-name">{{ ou.amount }}</h2>

                            <p class="bio-position">{{ ou.time }}</p>
                        </div>

                        <div class="box-actions">
                            <a href="{% url 'web:out_featured' pk=ou.id %}">
                                <button>

                                        <path d="M17.465 5.121l-6.172 6.172 1.414 1.414 6.172-6.172 2.12 2.121L21 3h-5.657z"></path>

                                </button>

                                <button>
                                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">

                                    </svg>
                                </button>

                                    </svg>
                                </button>
                            </a>
                        </div>
                    </a>
                </div>
            {% endfor %}
        </section>


    </div>
{% endblock %}
