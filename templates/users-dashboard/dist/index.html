<!DOCTYPE html>
<html lang="en">
{% load static %}
<head>
    {% block head %}
        <meta charset="UTF-8">
        <title>CodePen - Users Dashboard</title>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/normalize/5.0.0/normalize.min.css">
        <link rel='stylesheet'
              href='https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css'>
        <link rel="stylesheet" href="./style.css">
        <style>
            * {
                box-sizing: border-box;
            }

            html,
            body {
                color: #99a0b0;
                width: 100%;
                height: 100%;
                overflow: hidden;
                background: #f5f5fa;
                font-size: 16px;
                line-height: 120%;
                font-family: Open Sans, Helvetica, sans-serif;
            }

            .dashboard {
                display: grid;
                width: 100%;
                height: 100%;
                grid-gap: 0;
                grid-template-columns: 300px auto;
                grid-template-rows: 80px auto;
                grid-template-areas: 'menu search' 'menu content';
            }

            .search-wrap {
                grid-area: search;
                background: #fff;
                border-bottom: 1px solid #ede8f0;
                display: flex;
                align-items: center;
                justify-content: space-between;
                padding: 0 3em;
            }

            .search-wrap .search {
                height: 40px;
            }

            .search-wrap .search label {
                display: flex;
                align-items: center;
                height: 100%;
            }

            .search-wrap .search label svg {
                display: block;
            }

            .search-wrap .search label svg path,
            .search-wrap .search label svg circle {
                fill: #b6bbc6;
                transition: fill 0.15s ease;
            }

            .search-wrap .search label input {
                display: block;
                padding-left: 1em;
                height: 100%;
                margin: 0;
                border: 0;
            }

            .search-wrap .search label input:focus {
                background: #f5f5fa;
            }

            .search-wrap .search label:hover svg path,
            .search-wrap .search label:hover svg circle {
                fill: #2b3a60;
            }

            .search-wrap .user-actions button {
                border: 0;
                background: none;
                width: 32px;
                height: 32px;
                margin: 0;
                padding: 0;
                margin-left: 0.5em;
            }

            .search-wrap .user-actions button svg {
                position: relative;
                top: 2px;
            }

            .search-wrap .user-actions button svg path,
            .search-wrap .user-actions button svg circle {
                fill: #b6bbc6;
                transition: fill 0.15s ease;
            }

            .search-wrap .user-actions button:hover svg path,
            .search-wrap .user-actions button:hover svg circle {
                fill: #2b3a60;
            }

            .menu-wrap {
                grid-area: menu;
                padding-bottom: 3em;
                overflow: auto;
                background: #fff;
                border-right: 1px solid #ede8f0;
            }

            .menu-wrap .user {
                height: 80px;
                display: flex;
                align-items: center;
                justify-content: flex-start;
                margin: 0;
                padding: 0 3em;
            }

            .menu-wrap .user .user-avatar {
                width: 40px;
                height: 40px;
                border-radius: 50%;
                overflow: hidden;
            }

            .menu-wrap .user .user-avatar img {
                display: block;
                width: 100%;
                height: 100%;
                -o-object-fit: cover;
                object-fit: cover;
            }

            .menu-wrap .user figcaption {
                margin: 0;
                padding: 0 0 0 1em;
                color: #1b253d;
                font-weight: 700;
                font-size: 0.875em;
                line-height: 100%;
            }

            .menu-wrap nav {
                display: block;
                padding: 0 3em;
            }

            .menu-wrap nav section {
                display: block;
                padding: 3em 0 0;
            }

            .menu-wrap nav h3 {
                margin: 0;
                font-size: 0.875em;
                text-transform: uppercase;
                color: #4b84fe;
                font-weight: 600;
            }

            .menu-wrap nav ul {
                display: block;
                padding: 0;
                margin: 0;
            }

            .menu-wrap nav li {
                display: block;
                padding: 0;
                margin: 1em 0 0;
            }

            .menu-wrap nav li a {
                display: flex;
                align-items: center;
                justify-content: flex-start;
                color: #99a0b0;
                text-decoration: none;
                font-weight: 600;
                font-size: 0.875em;
                transition: color 0.15s ease;
            }

            .menu-wrap nav li a svg {
                display: block;
                margin-right: 1em;
            }

            .menu-wrap nav li a svg path,
            .menu-wrap nav li a svg circle {
                fill: #b6bbc6;
                transition: fill 0.15s ease;
            }

            .menu-wrap nav li a:hover {
                color: #1b253d;
            }

            .menu-wrap nav li a:hover svg path,
            .menu-wrap nav li a:hover svg circle {
                fill: #2b3a60;
            }

            .menu-wrap nav li a.active {
                color: #4b84fe;
            }

            .menu-wrap nav li a.active svg path,
            .menu-wrap nav li a.active svg circle {
                fill: #4b84fe;
            }

            .content-wrap {
                grid-area: content;
                padding: 3em;
                overflow: auto;
            }

            .content-wrap .content-head {
                display: flex;
                align-items: center;
                justify-content: space-between;
            }

            .content-wrap .content-head h1 {
                font-size: 1.375em;
                line-height: 100%;
                color: #1b253d;
                font-weight: 500;
                margin: 0;
                padding: 0;
            }

            .content-wrap .content-head .action button {
                border: 0;
                background: #4b84fe;
                color: #fff;
                width: auto;
                height: 3.5em;
                padding: 0 2.25em;
                border-radius: 3.5em;
                font-size: 1em;
                text-transform: uppercase;
                font-weight: 600;
                transition: background-color 0.15s ease;
            }

            .content-wrap .content-head .action button:hover {
                background-color: #1861fe;
            }

            .content-wrap .content-head .action button:hover:active {
                background-color: #0149e2;
                transition: none;
            }

            .content-wrap .info-boxes {
                padding: 3em 0 2em;
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
                grid-gap: 2em;
            }

            .content-wrap .info-boxes .info-box {
                background: #fff;
                height: 160px;
                display: flex;
                align-items: center;
                justify-content: flex-start;
                padding: 0 3em;
                border: 1px solid #ede8f0;
                border-radius: 5px;
            }

            .content-wrap .info-boxes .info-box .box-icon svg {
                display: block;
                width: 48px;
                height: 48px;
            }

            .content-wrap .info-boxes .info-box .box-icon svg path,
            .content-wrap .info-boxes .info-box .box-icon svg circle {
                fill: #99a0b0;
            }

            .content-wrap .info-boxes .info-box .box-content {
                padding-left: 1.25em;
                white-space: nowrap;
            }

            .content-wrap .info-boxes .info-box .box-content .big {
                display: block;
                font-size: 2em;
                line-height: 150%;
                color: #1b253d;
            }

            .content-wrap .info-boxes .info-box.active svg circle,
            .content-wrap .info-boxes .info-box.active svg path {
                fill: #4b84fe;
            }

            .content-wrap .person-boxes {
                padding: 0;
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
                grid-gap: 2em;
            }

            .content-wrap .person-boxes .person-box {
                background: #fff;
                height: 320px;
                text-align: center;
                padding: 3em;
                border: 1px solid #ede8f0;
                border-radius: 5px;
            }

            .content-wrap .person-boxes .person-box:nth-child(2n) .box-avatar .no-name {
                background: #4b84fe;
            }

            .content-wrap .person-boxes .person-box:nth-child(5n) .box-avatar .no-name {
                background: #ffbb09;
            }

            .content-wrap .person-boxes .person-box .box-avatar {
                width: 100px;
                height: 100px;
                border-radius: 50%;
                margin: 0px auto;
                overflow: hidden;
            }

            .content-wrap .person-boxes .person-box .box-avatar img {
                display: block;
                width: 100%;
                height: 100%;
                -o-object-fit: cover;
                object-fit: cover;
            }

            .content-wrap .person-boxes .person-box .box-avatar .no-name {
                display: flex;
                align-items: center;
                justify-content: center;
                text-align: center;
                color: #fff;
                font-size: 1.5em;
                font-weight: 600;
                text-transform: uppercase;
                width: 100%;
                height: 100%;
                background: #fa5b67;
            }

            .content-wrap .person-boxes .person-box .box-bio {
            {#white-space: no-wrap;#}
            }

            .content-wrap .person-boxes .person-box .box-bio .bio-name {
                margin: 2em 0 0.75em;
                color: #1b253d;
                font-size: 1em;
                font-weight: 700;
                line-height: 100%;
            }

            .content-wrap .person-boxes .person-box .box-bio .bio-position {
                margin: 0;
                font-size: 0.875em;
                line-height: 100%;
            }

            .content-wrap .person-boxes .person-box .box-actions {
                margin-top: 1.25em;
                padding-top: 1.25em;
                width: 100%;
                border-top: 1px solid #ede8f0;
                display: flex;
                align-items: center;
                justify-content: space-between;
            }

            .content-wrap .person-boxes .person-box .box-actions button {
                border: 0;
                background: none;
                width: 32px;
                height: 32px;
                margin: 0;
                padding: 0;
            }

            .content-wrap .person-boxes .person-box .box-actions button svg {
                position: relative;
                top: 2px;
            }

            .content-wrap .person-boxes .person-box .box-actions button svg path,
            .content-wrap .person-boxes .person-box .box-actions button svg circle {
                fill: #b6bbc6;
                transition: fill 0.15s ease;
            }

            .content-wrap .person-boxes .person-box .box-actions button:hover svg path,
            .content-wrap .person-boxes .person-box .box-actions button:hover svg circle {
                fill: #2b3a60;
            }

            a {
                text-decoration: none;
            }


        </style>


    {% endblock %}
</head>
<body>
<!-- partial:index.partial.html -->
<div class="dashboard">

    <aside class="search-wrap">
        <div class="user-actions">

            <a href="{% url 'account:logout' %}">
                <button>
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
                        <path d="M12 21c4.411 0 8-3.589 8-8 0-3.35-2.072-6.221-5-7.411v2.223A6 6 0 0 1 18 13c0 3.309-2.691 6-6 6s-6-2.691-6-6a5.999 5.999 0 0 1 3-5.188V5.589C6.072 6.779 4 9.65 4 13c0 4.411 3.589 8 8 8z"/>
                        <path d="M11 2h2v10h-2z"/>
                    </svg>
                </button>
            </a>
        </div>
    </aside>

    <header class="menu-wrap">
        <a href="{% url 'web:user_info' %}" style="text-decoration: none ;width: 20px;height: 20px">
            <figure class="user">

                <div class="user-avatar">
                    <img src="{{ user.profile.url }}" alt="{{ user.first_name }}">
                </div>
                <figcaption>
                    {{ user.username }}
                </figcaption>

            </figure>
        </a>
        <nav>
            <section class="dicover">
                <h3>Income and Expenditure</h3>

                <ul>
                    <li>
                        <a href="{% url 'web:income_all' %}">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
                                <path d="M6.855 14.365l-1.817 6.36a1.001 1.001 0 0 0 1.517 1.106L12 18.202l5.445 3.63a1 1 0 0 0 1.517-1.106l-1.817-6.36 4.48-3.584a1.001 1.001 0 0 0-.461-1.767l-5.497-.916-2.772-5.545c-.34-.678-1.449-.678-1.789 0L8.333 8.098l-5.497.916a1 1 0 0 0-.461 1.767l4.48 3.584zm2.309-4.379c.315-.053.587-.253.73-.539L12 5.236l2.105 4.211c.144.286.415.486.73.539l3.79.632-3.251 2.601a1.003 1.003 0 0 0-.337 1.056l1.253 4.385-3.736-2.491a1 1 0 0 0-1.109-.001l-3.736 2.491 1.253-4.385a1.002 1.002 0 0 0-.337-1.056l-3.251-2.601 3.79-.631z"/>
                            </svg>
                            income
                        </a>
                    </li>

                    <li>
                        <a href="{% url 'web:out_all' %}">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
                                <path d="M20.205 4.791a5.938 5.938 0 0 0-4.209-1.754A5.906 5.906 0 0 0 12 4.595a5.904 5.904 0 0 0-3.996-1.558 5.942 5.942 0 0 0-4.213 1.758c-2.353 2.363-2.352 6.059.002 8.412l7.332 7.332c.17.299.498.492.875.492a.99.99 0 0 0 .792-.409l7.415-7.415c2.354-2.353 2.355-6.049-.002-8.416zm-1.412 7.002L12 18.586l-6.793-6.793c-1.562-1.563-1.561-4.017-.002-5.584.76-.756 1.754-1.172 2.799-1.172s2.035.416 2.789 1.17l.5.5a.999.999 0 0 0 1.414 0l.5-.5c1.512-1.509 4.074-1.505 5.584-.002 1.563 1.571 1.564 4.025.002 5.588z"/>
                            </svg>
                            Out
                        </a>
                    </li>
                </ul>
            </section>

            <section class="tools">
                <h3>Tools</h3>

                <ul>
                    <li>
                        <a href="#">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
                                <path d="M21 20V4a1 1 0 0 0-1-1H4a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h16a1 1 0 0 0 1-1zm-2-1H5V5h14v14z"></path>
                                <path d="M10.381 12.309l3.172 1.586a1 1 0 0 0 1.305-.38l3-5-1.715-1.029-2.523 4.206-3.172-1.586a1.002 1.002 0 0 0-1.305.38l-3 5 1.715 1.029 2.523-4.206z"></path>
                            </svg>
                            Show Chart
                        </a>
                    </li>
                    <li>
                        <a href="#" class="active">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
                                <path d="M10 18a7.952 7.952 0 0 0 4.897-1.688l4.396 4.396 1.414-1.414-4.396-4.396A7.952 7.952 0 0 0 18 10c0-4.411-3.589-8-8-8s-8 3.589-8 8 3.589 8 8 8zm0-14c3.309 0 6 2.691 6 6s-2.691 6-6 6-6-2.691-6-6 2.691-6 6-6z"/>
                            </svg>
                            Search
                        </a>
                    </li>

                    <li>
                        <a href="{% url 'web:Transaction_Registration' %}" style="width: 250px">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
                                <path d="M13 7L11 7 11 11 7 11 7 13 11 13 11 17 13 17 13 13 17 13 17 11 13 11z"/>
                                <path d="M12,2C6.486,2,2,6.486,2,12s4.486,10,10,10c5.514,0,10-4.486,10-10S17.514,2,12,2z M12,20c-4.411,0-8-3.589-8-8 s3.589-8,8-8s8,3.589,8,8S16.411,20,12,20z"/>
                            </svg>
                            Transaction Registration
                        </a>
                    </li>

                    <li>
                        <a href="{% url 'web:comment' %}">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
                                <path d="M21 4H3a1 1 0 0 0-1 1v14a1 1 0 0 0 1 1h18a1 1 0 0 0 1-1V5a1 1 0 0 0-1-1zm-1 14H4V9.227l7.335 6.521a1.003 1.003 0 0 0 1.33-.001L20 9.227V18zm0-11.448l-8 7.11-8-7.111V6h16v.552z"/>
                            </svg>
                            Send Report
                        </a>
                    </li>
                    <li>
                        <a href="{% url 'web:show_featured' %}">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
                                <path d="M6.855 14.365l-1.817 6.36a1.001 1.001 0 0 0 1.517 1.106L12 18.202l5.445 3.63a1 1 0 0 0 1.517-1.106l-1.817-6.36 4.48-3.584a1.001 1.001 0 0 0-.461-1.767l-5.497-.916-2.772-5.545c-.34-.678-1.449-.678-1.789 0L8.333 8.098l-5.497.916a1 1 0 0 0-.461 1.767l4.48 3.584zm2.309-4.379c.315-.053.587-.253.73-.539L12 5.236l2.105 4.211c.144.286.415.486.73.539l3.79.632-3.251 2.601a1.003 1.003 0 0 0-.337 1.056l1.253 4.385-3.736-2.491a1 1 0 0 0-1.109-.001l-3.736 2.491 1.253-4.385a1.002 1.002 0 0 0-.337-1.056l-3.251-2.601 3.79-.631z"/>
                            </svg>
                            Featured
                        </a>
                    </li>

                    <li>
                        <a href="{% url 'account:show_price' %}">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
                                <path d="M20 10H4a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h16a1 1 0 0 0 1-1V11a1 1 0 0 0-1-1zm-1 10H5v-8h14v8zM5 6h14v2H5zM7 2h10v2H7z"></path>
                            </svg>
                            Online Price
                        </a>

                    </li>
                </ul>

            </section>
        </nav>
    </header>

    <main class="content-wrap">
        {% block contex %}
        {% endblock %}
    </main>
</div>

<!-- partial -->

</body>
</html>
